use_default_settings: true

general:
  instance_name: 'searxng'

search:
  # Vane sends no language, so engines like Bing localise to the server's IP country
  # (7 of 24 results were Greek for an English query; 1 of 25 with "en"). "auto" does
  # not help. Set this to the language you search in.
  default_lang: 'en'
  autocomplete: 'google'
  formats:
    - html
    - json

server:
  # Replace with a random value before use, e.g. `openssl rand -hex 32` (see README).
  # Do not use 'ultrasecretkey': SearXNG refuses to start with it.
  secret_key: 'REPLACE_ME_RUN_THE_COMMAND_IN_README'

engines:
  # Enabled: verified working (2026-10-11); most default engines were blocked
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: bing news
    disabled: false

  # Academic source (Vane's academic_search, see patches/patch-scholarly-sources.js).
  # Verified 2026-10-27: both return results for keyword and sentence-style queries,
  # with authors, dates and DOIs. Off by default in SearXNG.
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false

  # Social source (Vane's social_search, see patches/patch-social-sources.js).
  # Reddit's own engine is blocked (JSON API 403), so forums are used instead.
  # Lemmy and Stack Exchange engines are on by default; Hacker News is not.
  - name: hackernews
    disabled: false

  # Disabled: hard failures (access denied / HTTP error)
  - name: aol
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true

  # Disabled: blocked or empty on this network (2026-10-27, scripts/engine-check.mjs).
  # SearXNG waits for every enabled engine on each query, so dead ones add latency.
  # Vane never calls wolframalpha itself. Re-check with engine-check on a new network.
  # (patch-social-sources still names some of these explicitly for site:reddit.com
  # searches; an explicitly named engine runs even when disabled here.)
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: google
    disabled: true
  - name: wolframalpha
    disabled: true
