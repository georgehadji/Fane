use_default_settings: true

general:
  instance_name: 'searxng'

search:
  # Vane sends no language, so engines like Bing localise to the server's IP country
  # (7 of 24 results were Greek for an English query; 1 of 25 with "en"). "auto" does
  # not help. Set this to the language you search in.
  default_lang: 'en'
  autocomplete: 'google'
  formats:
    - html
    - json

server:
  # Replace with a random value before use, e.g. `openssl rand -hex 32` (see README).
  # Do not use 'ultrasecretkey': SearXNG refuses to start with it.
  secret_key: 'REPLACE_ME_RUN_THE_COMMAND_IN_README'

engines:
  # Enabled: verified working (2026-10-11); most default engines were blocked
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: bing news
    disabled: false

  # Academic source (Vane's academic_search, see patches/patch-scholarly-sources.js).
  # Verified 2026-10-27: both return results for keyword and sentence-style queries,
  # with authors, dates and DOIs. Off by default in SearXNG.
  - name: openalex
    disabled: false
  - name: crossref
    disabled: false
  # CORE: open-access papers, many with full text. Needs a free API key
  # (https://core.ac.uk/services/api). The installers (scripts/searxng-settings.mjs,
  # docker/fane-entrypoint.sh) write CORE_API_KEY into api_key and switch the engine on;
  # without the variable it stays off. Never put the key in this file.
  - name: core.ac.uk
    api_key: ''
    inactive: true

  # Social source (Vane's social_search, see patches/patch-social-sources.js).
  # Reddit's own engine is blocked (JSON API 403), so forums are used instead.
  # Lemmy and Stack Exchange engines are on by default; Hacker News is not.
  - name: hackernews
    disabled: false

  # Brave Search API (https://brave.com/search/api): an index of its own, so no CAPTCHA and no block by IP. Needs a
  # subscription token. The installers (scripts/searxng-settings.mjs, docker/fane-entrypoint.sh) write BRAVE_API_KEY
  # into the X-Subscription-Token header and switch the engine on; without the variable it stays off. Never put the
  # key in this file. The free plan allows one request a second: a 429 gives no results instead of an error, because
  # SearXNG suspends an engine that errors. The scraping engine named "brave" below stays off.
  - name: brave api
    engine: json_engine
    shortcut: brapi
    categories: general
    search_url: https://api.search.brave.com/res/v1/web/search?q={query}&count=20&search_lang={lang}&safesearch=off
    results_query: web/results
    url_query: url
    title_query: title
    content_query: description
    title_html_to_text: true
    content_html_to_text: true
    no_result_for_http_status: [429]
    timeout: 6.0
    headers:
      Accept: application/json
      X-Subscription-Token: ''
    inactive: true

  # Tavily (https://tavily.com): a search API built for LLM answers, an index of its own like Brave's. Same rules as
  # brave api: the installers write TAVILY_API_KEY into the Authorization header and switch the engine on; never put
  # the key in this file. One basic search is one credit (the free plan has 1000 a month). json_engine puts the query
  # into the body unescaped, so a query with a double quote or backslash is invalid JSON: Tavily's 400 gives no results.
  # 432/433 are Tavily's plan and pay-as-you-go limits.
  - name: tavily
    engine: json_engine
    shortcut: tav
    categories: general
    search_url: https://api.tavily.com/search
    method: POST
    request_body: >-
      {{"query": "{query}", "max_results": 10, "search_depth": "basic"}}
    results_query: results
    url_query: url
    title_query: title
    content_query: content
    no_result_for_http_status: [400, 429, 432, 433]
    timeout: 8.0
    headers:
      Content-Type: application/json
      Authorization: ''
    inactive: true

  # Perplexity Search API (https://docs.perplexity.ai): ranked web results from Perplexity's own index. Same rules as
  # tavily: the installers write PERPLEXITY_API_KEY into the Authorization header and switch the engine on; never put
  # the key in this file. Each query is one request, $1 per 1000 with search_type "fast" ($5 with "web"). json_engine
  # puts the query into the body unescaped, so a query with a double quote or backslash is invalid JSON: the 400 gives
  # no results. 429 is the rate limit.
  - name: perplexity
    engine: json_engine
    shortcut: pplx
    categories: general
    search_url: https://api.perplexity.ai/search
    method: POST
    request_body: >-
      {{"query": "{query}", "max_results": 10, "search_type": "fast"}}
    results_query: results
    url_query: url
    title_query: title
    content_query: snippet
    no_result_for_http_status: [400, 429]
    timeout: 8.0
    headers:
      Content-Type: application/json
      Authorization: ''
    inactive: true

  # Disabled: hard failures (access denied / HTTP error)
  - name: aol
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true

  # Disabled: blocked or empty on this network (2026-10-27, scripts/engine-check.mjs).
  # SearXNG waits for every enabled engine on each query, so dead ones add latency.
  # Vane never calls wolframalpha itself. Re-check with engine-check on a new network.
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: google
    disabled: true
  - name: wolframalpha
    disabled: true
