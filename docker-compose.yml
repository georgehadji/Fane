# Vane with the Fane patches and SearXNG settings applied on every start.
#   docker compose up -d
# Image is pinned to the digest the patches were verified against (Vane 1.12.2).
# To move to a newer Vane, change the digest, then check `vane --doctor`.
services:
  vane:
    image: itzcrazykns1337/vane@sha256:0b61bf0d4470e9f2a9c71f794b72fab6e5a612177172770684c158a461f6896e
    container_name: ${VANE_CONTAINER:-vane}
    restart: unless-stopped
    ports:
      # Localhost only: Vane has no login and /api/config returns the provider API keys.
      - "127.0.0.1:${VANE_PORT:-3000}:3000"
    volumes:
      - vane-data:/home/vane/data
      - ./patches:/fane/patches:ro
      - ./searxng:/fane/searxng:ro
      - ./docker:/fane/docker:ro
      # FANE_CORE_DIR in patches/lib/vane.js; the hooks below import it as ../core
      - ./cli/core:/fane/core:ro
      # FANE_IMAGE_DIR in patches/lib/vane.js; used by patch-image-chat (images in the web UI)
      - ./cli/image:/fane/image:ro
      # FANE_WRITE_DIR in patches/lib/vane.js; used by patch-article-chat (articles in the web UI)
      - ./cli/write:/fane/write:ro
      # FANE_CODE_DIR in patches/lib/vane.js; used by patch-code-chat (code in the web UI)
      - ./cli/code:/fane/code:ro
      # FANE_BRAINSTORM_DIR in patches/lib/vane.js; used by patch-brainstorm-chat (brainstorming in the web UI)
      - ./cli/brainstorm:/fane/brainstorm:ro
    environment:
      # Switches on the CORE academic engine (searxng/settings.yml); empty leaves it off.
      CORE_API_KEY: ${CORE_API_KEY:-}
      # Switches on the Brave Search API engine (searxng/settings.yml); empty leaves it off.
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # Switches on the Tavily engine (searxng/settings.yml); empty leaves it off.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Spend limit in USD for one article, code or brainstorm run (cli/write/llm.mjs); empty is no limit.
      FANE_MAX_COST: ${FANE_MAX_COST:-}
      # Minutes one web request may run in total (cli/image/openrouter.mjs); empty is 30, 0 is no limit.
      FANE_DEADLINE_MIN: ${FANE_DEADLINE_MIN:-}
      # Megabytes the stored images may take (cli/image/store.mjs); the oldest go first. Empty is 1024.
      FANE_IMAGE_STORE_MB: ${FANE_IMAGE_STORE_MB:-}
    entrypoint: ["sh", "/fane/docker/fane-entrypoint.sh"]
    command: ["/home/vane/entrypoint.sh"]

volumes:
  vane-data:
    # Same name as the volume in the README's `docker run`, so existing settings carry over.
    name: ${VANE_VOLUME:-vane-data}
