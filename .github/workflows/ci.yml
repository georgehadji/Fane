name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check cli/vane.mjs && node --check scripts/apply.mjs && node --check scripts/engine-check.mjs && node --check scripts/bench.mjs && node --check scripts/article-trial.mjs && node --check scripts/code-trial.mjs
      - run: npm test --prefix cli

  # The patches match exact fragments of the pinned Vane build. This fails when the
  # pinned digest and the patches drift apart, and checks that re-running is safe.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two full passes in file order, as apply.mjs and the Compose entrypoint run them:
      # a later patch editing an earlier one's output must not break re-runs.
      - name: Apply all patches twice inside the pinned image
        run: |
          image=$(grep -o 'itzcrazykns1337/vane@sha256:[0-9a-f]*' docker-compose.yml)
          docker run --rm -u 0 --entrypoint sh -v "$PWD/patches:/p:ro" "$image" -c '
            set -e
            for pass in 1 2; do for f in /p/*.js; do node "$f"; done; done
            # every patched bundle (each patch leaves a .bak) must still parse, server and browser
            for b in $(find /home/vane/.next/server /home/vane/public/_next -name "*.js.bak"); do node --check "${b%.bak}"; echo "parses: ${b%.bak}"; done'
      # Fane's hooks are loaded by import() from inside Vane; a missing sibling folder or a bad import would only
      # show as "unavailable" in a chat. The folders sit side by side as in docker-compose.yml.
      - name: Import the hooks inside the pinned image
        run: |
          image=$(grep -o 'itzcrazykns1337/vane@sha256:[0-9a-f]*' docker-compose.yml)
          docker run --rm -u 0 --entrypoint node             -v "$PWD/cli/core:/fane/core:ro" -v "$PWD/cli/image:/fane/image:ro" -v "$PWD/cli/write:/fane/write:ro" -v "$PWD/cli/code:/fane/code:ro" -v "$PWD/cli/brainstorm:/fane/brainstorm:ro"             "$image" --input-type=module -e "for (const d of ['image', 'write', 'code', 'brainstorm']) { const m = await import('/fane/' + d + '/vane-hook.mjs'); console.log('imports:', d, Object.keys(m).join(',')); } const q = await import('/fane/write/quality-check.mjs'); console.log('imports: quality-check', Object.keys(q).join(','));"
      # docker/fane-entrypoint.sh runs only under Compose. Start it as a user would: Vane must answer and the
      # entrypoint must have patched it (a patch leaves a .bak; a failing one only warns and Vane starts unpatched).
      - name: Start with Compose and check the entrypoint patched Vane
        run: |
          docker compose up -d
          ok=0
          for i in $(seq 60); do curl -fs http://127.0.0.1:3000/api/providers >/dev/null && ok=1 && break; sleep 2; done
          if [ "$ok" = 1 ]; then docker exec vane test -f /home/vane/.next/server/chunks/641.js.bak || ok=0; fi
          if [ "$ok" != 1 ]; then docker compose logs; fi
          docker compose down -v
          [ "$ok" = 1 ]
